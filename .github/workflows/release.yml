name: Build and release macOS app

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use X.Y.Z format: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run Swift tests
        run: swift test

      - name: Build development artifacts
        env:
          AI_USAGE_VERSION: ${{ steps.version.outputs.version }}
          AI_USAGE_BUILD: ${{ github.run_number }}
          AI_USAGE_SIGNING_IDENTITY: "-"
        run: scripts/package-release.sh

      - name: Verify development artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 ".build/release/AiUsageMenu.app"
          unzip -t ".build/dist/AIUsageMenu-${VERSION}.zip"
          hdiutil verify ".build/dist/AIUsageMenu.dmg"
          (
            cd .build/dist
            shasum -a 256 -c checksums.txt
          )

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIUsageMenu-${{ steps.version.outputs.version }}-development
          path: |
            .build/dist/AIUsageMenu-${{ steps.version.outputs.version }}.zip
            .build/dist/AIUsageMenu.dmg
            .build/dist/checksums.txt
            .build/dist/update.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use X.Y.Z format: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Developer ID signing
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            "$CERTIFICATE_BASE64" \
            "$CERTIFICATE_PASSWORD" \
            "$ASC_KEY_ID" \
            "$ASC_ISSUER_ID" \
            "$ASC_PRIVATE_KEY_BASE64"; do
            if [[ -z "$value" ]]; then
              echo "All five documented signing and notarization secrets are required." >&2
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          echo "keychain=$keychain_path" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          if [[ "$identity" != *"(9JLJ6MJLMJ)" ]]; then
            echo "Developer ID identity must belong to Happenings team 9JLJ6MJLMJ." >&2
            exit 1
          fi

          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build signed release artifacts
        env:
          AI_USAGE_VERSION: ${{ steps.version.outputs.version }}
          AI_USAGE_BUILD: ${{ github.run_number }}
          AI_USAGE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: scripts/package-release.sh

      - name: Install App Store Connect CLI
        run: brew install asc

      - name: Notarize and staple release artifacts
        shell: bash
        env:
          AI_USAGE_VERSION: ${{ steps.version.outputs.version }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          private_key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key_path"
          chmod 600 "$private_key_path"

          asc auth login \
            --bypass-keychain \
            --name release-ci \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key "$private_key_path" \
            --network

          asc notarization submit \
            --file ".build/dist/AIUsageMenu-${AI_USAGE_VERSION}.zip" \
            --wait \
            --timeout 1h \
            --output table
          xcrun stapler staple ".build/release/AiUsageMenu.app"

          AI_USAGE_SKIP_BUILD=1 scripts/package-release.sh

          asc notarization submit \
            --file ".build/dist/AIUsageMenu.dmg" \
            --wait \
            --timeout 1h \
            --output table
          xcrun stapler staple ".build/dist/AIUsageMenu.dmg"

          (
            cd .build/dist
            shasum -a 256 \
              "AIUsageMenu-${AI_USAGE_VERSION}.zip" \
              "AIUsageMenu.dmg" > checksums.txt
          )

      - name: Verify notarized release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 ".build/release/AiUsageMenu.app"
          codesign -d --verbose=4 ".build/release/AiUsageMenu.app" 2>&1 |
            grep -q '^TeamIdentifier=9JLJ6MJLMJ$'
          spctl --assess --type execute --verbose=2 ".build/release/AiUsageMenu.app"
          xcrun stapler validate ".build/release/AiUsageMenu.app"
          xcrun stapler validate ".build/dist/AIUsageMenu.dmg"
          unzip -t ".build/dist/AIUsageMenu-${VERSION}.zip"
          hdiutil verify ".build/dist/AIUsageMenu.dmg"
          (
            cd .build/dist
            shasum -a 256 -c checksums.txt
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=(
            ".build/dist/AIUsageMenu-${VERSION}.zip"
            ".build/dist/AIUsageMenu.dmg"
            ".build/dist/checksums.txt"
            ".build/dist/update.json"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$tag"
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$SIGNING_KEYCHAIN"
